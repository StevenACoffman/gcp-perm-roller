# Styles come from packages that `vale sync` installs into .vale/styles (gitignored);
# the vocabularies in .vale/styles/config/vocabularies are checked in. `just vale` syncs
# first.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Readability, alex, proselint, write-good, https://github.com/elastic/vale-rules/releases/latest/download/elastic-vale.zip
Vocab = ElasticTerms, TechJargon, ThirdPartyProducts, GcpPermRoller

[*.md]
BasedOnStyles = Readability,alex,proselint,write-good,Elastic

# A to-do list is about TODOs, so the word is no annotation left behind.
[TODO.md]
proselint.Annotations = NO
